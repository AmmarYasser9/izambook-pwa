<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- تظبيط الشاشة عشان تمنع الزووم وتخليها قد الموبايل بالظبط -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IzamBook</title>
  
  <!-- 1. ربط ملف الـ Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- 2. أيقونة الأندرويد والمتصفح العادي -->
  <link rel="icon" href="logo.png">
  
  <!-- 3. أيقونة الآيفون المخصوصة (اللي هترفعها بالخلفية السودة والهوامش الكبيرة) -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-icon.png">
  
  <!-- 4. إعدادات أبل (iOS) عشان يفتح كأبلكيشن شاشة كاملة -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IzamBook">
  <meta name="theme-color" content="#0a0d14">
  
  <style>
    /* إخفاء أي هوامش وتلوين الخلفية بالدارك مود لحين تحميل السيستم */
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #0a0d14; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  
  <!-- ⚠️ شيل كلمة YOUR_SCRIPT_ID وحط اللينك بتاع Google Apps Script بتاعك اللي آخره /exec -->
  <iframe src="https://script.google.com/macros/s/AKfycbxNsBF4k0j7WeNDGJNCdF-IFMBC1mRMy9uadr1QzjjJeAC8vTBFxr7OPCNSluGaQ9gk/exec"></iframe>

  <script>
    // تفعيل الـ Service Worker عشان الموبايل يرضى يسطبه كأبلكيشن
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          console.log('Service Worker Registered!', reg);
        }).catch(err => {
          console.log('Service Worker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
