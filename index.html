<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IzamBook</title>
  
  <!-- ربط ملف الـ Manifest واللوجو -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="icon" href="logo.png">
  
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #0a0d14; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  
  <!-- ⚠️ حط هنا اللينك الطويل بتاع Google Apps Script (اللي آخره /exec) -->
  <iframe src="https://script.google.com/a/macros/izam.co/s/AKfycbxNsBF4k0j7WeNDGJNCdF-IFMBC1mRMy9uadr1QzjjJeAC8vTBFxr7OPCNSluGaQ9gk/exec"></iframe>

  <script>
    // تفعيل الـ Service Worker عشان الموبايل يرضى يسطبه كأبلكيشن
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          console.log('Service Worker Registered!', reg);
        }).catch(err => {
          console.log('Service Worker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
